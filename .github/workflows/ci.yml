name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            command: cargo test --locked --no-default-features
          - name: default
            command: cargo test --locked
          - name: vllm
            command: cargo test --locked --no-default-features --features vllm
          - name: llama-cpp
            command: cargo test --locked --no-default-features --features llama-cpp
          - name: dashscope
            command: cargo test --locked --no-default-features --features dashscope
          - name: sglang
            command: cargo test --locked --no-default-features --features sglang
          - name: all-features
            command: cargo test --locked --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: ${{ matrix.command }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-features
